apiVersion: apps/v1
kind: Deployment
metadata:
  name: joke-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: joke-backend
  template:
    metadata:
      labels:
        app: joke-backend
    spec:
      containers:
        - name: backend
          image: harshak07/devops-joke-backend:latest
          ports:
            - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: joke-backend
spec:
  selector:
    app: joke-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP